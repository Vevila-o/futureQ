<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>計算中請稍後</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: #6b9a7a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', sans-serif;
    overflow: hidden;
  }

  .logo-circle {
    width: 190px;
    height: 190px;
    background: #ffffff;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 52px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }

  .logo-circle img {
    width: 68%;
    height: 68%;
    object-fit: contain;
  }

  .loading-row {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #ffffff;
  }

  .gear-icon {
    font-size: 30px;
    color: #ffffff;
    animation: spin 1.8s linear infinite;
    /* Material Symbols outlined style */
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 30;
  }

  .loading-label {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #ffffff;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="logo-circle">
    <img src="/static/img/logo.jpg.png" alt="聲影日記 Logo"/>
  </div>

  <div class="loading-row">
    <span class="material-symbols-outlined gear-icon">settings</span>
    <span class="loading-label">計算中請稍後</span>
  </div>

</body>
</html>
