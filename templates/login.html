<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>登入 - 聲影日記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../static/css/index.css"/>
<link rel="stylesheet" href="../static/css/login.css"/>
</head>
<body>

<main class="login-main">
  <div class="login-card">
    <div class="login-logo">
      <span class="material-symbols-outlined" style="font-size:32px;font-variation-settings:'FILL' 1;">mic_none</span>
    </div>
    <h1 class="login-title">聲影日記</h1>
    <p class="login-sub">登入以開始測試</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}"/>

      <label class="login-label" for="id_username">帳號</label>
      <input class="login-input" type="text" id="id_username" name="username" placeholder="請輸入帳號" autocomplete="username" required autofocus/>

      <label class="login-label" for="id_password">密碼</label>
      <input class="login-input" type="password" id="id_password" name="password" placeholder="請輸入密碼" autocomplete="current-password" required/>

      <button type="submit" class="login-btn">登入</button>
    </form>
  </div>
</main>

</body>
</html>
