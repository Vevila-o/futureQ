<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>憶智防線 - 整理菜籃</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/index.css">
  <link rel="stylesheet" href="../static/css/header.css">
  <link rel="stylesheet" href="../static/css/market.css">

  <style>
    /* 💡 新增：橘金色點數回饋膠囊卡片樣式 */
    .mkt-end-points-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #FFF9E6;  /* 暖心淺金黃色底 */
      border: 2px solid #FFE082;  /* 金黃色邊框 */
      color: #F57C00;             /* 飽滿橘金色字體，長輩看得很清楚 */
      font-size: 26px;            /* 大字級突顯成就感 */
      font-weight: 900;           /* 特粗體 */
      padding: 6px 24px;
      border-radius: 50px;        /* 完美的圓潤膠囊外觀 */
      margin: 10px auto 16px auto;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.18);
      box-sizing: border-box;
      animation: popInBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; /* 舒適的彈跳登場動畫 */
    }

    .mkt-end-points-badge .material-symbols-outlined {
      font-size: 28px;
      color: #FFB300;             /* 閃亮金幣圖標 */
      font-variation-settings: 'FILL' 1;
    }

    /* 點數卡片 Q 彈登場動畫軌道 */
    @keyframes popInBounce {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="headerback-placeholder"
     data-title="整理菜籃"
     data-icon="shopping_cart"
     data-back="/game/">
</div>

<main>

  <!-- 階段標記 + 進度 -->
  <div class="mkt-stage-badge" id="stageBadge">第 1 階段｜種類</div>

  <section class="mkt-progress-section">
    <div class="mkt-progress-info">
      <span id="progressLabel">第 1 題 / 共 3 題</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="mkt-progress-bar-bg">
      <div class="mkt-progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </section>

  <!-- 第四階段：當題規則提示 -->
  <div class="mkt-rule-hint" id="ruleHint" style="display:none;">
    <span class="material-symbols-outlined">help</span>
    <span id="ruleHintText">本題請依照「種類」分類</span>
  </div>

  <!-- 遊戲主區 -->
  <section class="mkt-game-area">

    <!-- 食材名稱（卡片上方） -->
    <p class="mkt-item-name" id="itemName">蘋果</p>

    <!-- 可拖曳食材卡片 -->
    <div class="mkt-card-wrap" id="cardWrap">
      <div class="mkt-card" id="gameCard">
        <span class="mkt-item-emoji" id="itemEmoji">🍎</span>
      </div>
    </div>

    <p class="mkt-instruction">把食材拖曳到正確的籃子！</p>

  </section>

  <!-- 籃子區（JS 動態生成 2 或 3 個） -->
  <section class="mkt-baskets" id="basketsEl"></section>

</main>

<!-- 階段說明 Overlay -->
<div class="mkt-announce-overlay" id="announceOverlay" style="display:none;">
  <div class="mkt-announce-box">
    <div class="mkt-announce-char">🤖</div>
    <div class="mkt-announce-stage" id="announceStage">第 1 階段</div>
    <p class="mkt-announce-title" id="announceTitle">遊戲開始！</p>
    <p class="mkt-announce-desc"  id="announceDesc">請依照「種類」將食材放入對應的籃子！</p>
    <div class="mkt-announce-pills" id="announcePills"></div>
    <button class="mkt-announce-btn" id="announceBtn">我了解了，開始！</button>
  </div>
</div>

<!-- 遊戲結束 Overlay -->
<div class="mkt-end-overlay" id="endOverlay" style="display:none;">
  <div class="mkt-end-box">
    <div class="mkt-end-icon" id="endIcon">🎉</div>
    <h2 class="mkt-end-title">遊戲結束！</h2>
    
    <!-- 總分顯示處 -->
    <p class="mkt-end-score" id="endScore"></p>
    
    <!-- 嵌入總分正下方的橘金色點數獎勵卡片 -->
    <div class="mkt-end-points-badge" id="endPointsBadge" style="display: none;">
      <span class="material-symbols-outlined">database</span>
      獲得 <span id="endPointsValue">+0</span> 點
    </div>

    <p class="mkt-end-msg"   id="endMsg"></p>

    <div class="mkt-end-stats">
      <div class="mkt-end-stat">
        <span class="mkt-end-stat-value" id="endAccuracy">0%</span>
        <span class="mkt-end-stat-label">正確率</span>
      </div>
      <div class="mkt-end-stat">
        <span class="mkt-end-stat-value" id="endReactionTime">0 秒</span>
        <span class="mkt-end-stat-label">平均反應時間</span>
      </div>
      <div class="mkt-end-stat">
        <span class="mkt-end-stat-value" id="endHesitation">0 次</span>
        <span class="mkt-end-stat-label">猶豫次數</span>
      </div>
    </div>

    <button class="mkt-end-btn"                 id="btnReplay">再玩一次</button>
    <button class="mkt-end-btn mkt-end-btn-sec" id="btnBack">回到遊戲首頁</button>
  </div>
</div>

<script src="../static/js/headerback.js"></script>
<script src="../static/js/market.js"></script>

<!-- 自動化點數 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const endOverlay = document.getElementById('endOverlay');
    const endScore = document.getElementById('endScore');
    const pointsBadge = document.getElementById('endPointsBadge');
    const pointsValue = document.getElementById('endPointsValue');

    if (endOverlay && endScore && pointsBadge && pointsValue) {
      // 監聽結算視窗的出現狀態
      const observer = new MutationObserver(() => {
        if (endOverlay.style.display !== 'none') {
          // 抓取結算文字中的總分數字
          const scoreText = endScore.innerText || "";
          const match = scoreText.match(/\d+/);
          const finalScore = match ? parseInt(match[0]) : 0;

          // 點數友善計算公式（基本 10 點，每 10 分換 1 點，最高 50 點）
          const calculatedPoints = Math.max(10, Math.min(50, Math.round(finalScore * 0.1)));

          // 注入數值並華麗現身
          pointsValue.innerText = `+${calculatedPoints}`;
          pointsBadge.style.display = 'inline-flex';
        } else {
          pointsBadge.style.display = 'none'; // 重新開始時重置隱藏
        }
      });

      observer.observe(endOverlay, { attributes: true, attributeFilter: ['style'] });
    }
  });
</script>

</body>
</html>
