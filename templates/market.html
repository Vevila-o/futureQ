<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>憶智防線 - 整理菜籃</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/index.css">

  <link rel="stylesheet" href="../static/css/header.css">
  <link rel="stylesheet" href="../static/css/market.css">
</head>
<body>

<div id="headerback-placeholder"
     data-title="整理菜籃"
     data-icon="shopping_cart"
     data-back="/game/">
</div>

<main>

  <!-- 階段標記 + 進度 -->
  <div class="mkt-stage-badge" id="stageBadge">第 1 階段｜種類</div>

  <section class="mkt-progress-section">
    <div class="mkt-progress-info">
      <span id="progressLabel">第 1 題 / 共 3 題</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="mkt-progress-bar-bg">
      <div class="mkt-progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </section>

  <!-- 第四階段：當題規則提示 -->
  <div class="mkt-rule-hint" id="ruleHint" style="display:none;">
    <span class="material-symbols-outlined">help</span>
    <span id="ruleHintText">本題請依照「種類」分類</span>
  </div>

  <!-- 遊戲主區 -->
  <section class="mkt-game-area">

    <!-- 食材名稱（卡片上方） -->
    <p class="mkt-item-name" id="itemName">蘋果</p>

    <!-- 可拖曳食材卡片 -->
    <div class="mkt-card-wrap" id="cardWrap">
      <div class="mkt-card" id="gameCard">
        <span class="mkt-item-emoji" id="itemEmoji">🍎</span>
      </div>
    </div>

    <p class="mkt-instruction">把食材拖曳到正確的籃子！</p>

  </section>

  <!-- 籃子區（JS 動態生成 2 或 3 個） -->
  <section class="mkt-baskets" id="basketsEl"></section>

</main>

<!-- 階段說明 Overlay -->
<div class="mkt-announce-overlay" id="announceOverlay" style="display:none;">
  <div class="mkt-announce-box">
    <div class="mkt-announce-char">🤖</div>
    <div class="mkt-announce-stage" id="announceStage">第 1 階段</div>
    <p class="mkt-announce-title" id="announceTitle">遊戲開始！</p>
    <p class="mkt-announce-desc"  id="announceDesc">請依照「種類」將食材放入對應的籃子！</p>
    <div class="mkt-announce-pills" id="announcePills"></div>
    <button class="mkt-announce-btn" id="announceBtn">我了解了，開始！</button>
  </div>
</div>

<!-- 遊戲結束 Overlay -->
<div class="mkt-end-overlay" id="endOverlay" style="display:none;">
  <div class="mkt-end-box">
    <div class="mkt-end-icon" id="endIcon">🎉</div>
    <h2 class="mkt-end-title">遊戲結束！</h2>
    <p class="mkt-end-score" id="endScore"></p>
    <p class="mkt-end-msg"   id="endMsg"></p>
    <button class="mkt-end-btn"           id="btnReplay">再玩一次</button>
    <button class="mkt-end-btn mkt-end-btn-sec" id="btnBack">回到遊戲首頁</button>
  </div>
</div>



<script src="../static/js/headerback.js"></script>

<script src="../static/js/market.js"></script>

</body>
</html>
