{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語音日記</title>
  <link rel="stylesheet" href="{% static 'index.css' %}">
</head>
<body>

<div class="app" id="app">

  <!-- ── Phase 1: 上傳照片 ─────────────────────────────── -->
  <section class="phase" id="phase-upload">

    <div class="header">
      <h1 class="logo">📖 語音日記</h1>
      <p class="tagline">用聲音，記錄生活的溫度</p>
    </div>

    <form method="post" action="{% url 'upload_photo' %}"
          enctype="multipart/form-data" id="upload-form">
      {% csrf_token %}
      <label class="drop-zone" id="drop-zone" for="photo-input">
        <div class="drop-zone-content" id="drop-content">
          <span class="drop-icon">📷</span>
          <span class="drop-text">點擊選擇照片</span>
          <span class="drop-hint">JPG・PNG・HEIC 均可</span>
        </div>
        <img id="upload-preview" class="upload-preview" alt="預覽">
      </label>
      <input type="file" id="photo-input" name="photo_file"
             accept="media/photo/*" class="sr-only" required>
      <button type="submit" class="btn btn-primary" id="upload-submit" disabled>
        選好了，開始記錄 →
      </button>
    </form>

  </section>

  <!-- ── Phase 2: 錄音（含 AI 追問泡泡）──────────────────── -->
  <section class="phase hidden" id="phase-record">

    <div class="record-header">
      <img id="photo-thumb" src="media/photo/" alt="照片" class="photo-thumb">
    </div>

    <div class="question-bubble hidden" id="question-bubble">
      <p id="question-text"></p>
    </div>

    <p class="record-prompt" id="record-prompt">
      說說這張照片背後的故事吧 ✨
    </p>

    <div class="recorder-wrap">
      <div class="timer hidden" id="timer">
        <span id="timer-sec">60</span> 秒
      </div>
      <button class="btn btn-record" id="btn-record">
        <span class="rec-dot"></span> 開始錄音
      </button>
      <button class="btn btn-stop hidden" id="btn-stop">
        ⏹ 停止錄音
      </button>
      <button class="btn btn-primary hidden" id="btn-submit">
        送出
      </button>
      <button class="btn hidden" id="btn-retry">
        再錄一次
      </button>
    </div>

  </section>

  <!-- ── Phase 3: 處理中 ───────────────────────────────── -->
  <section class="phase hidden" id="phase-processing">
    <div class="processing">
      <div class="spinner"></div>
      <p id="processing-msg">語音辨識中⋯</p>
    </div>
  </section>

  <!-- ── Phase 4: 結果 ─────────────────────────────────── -->
  <section class="phase hidden" id="phase-result">

    <div class="result-summary">
      <p id="result-summary-text"></p>
    </div>

    <div class="result-scores">
      <div class="score-item">
        <span class="score-label">詞彙豐富度</span>
        <span class="score-value" id="result-vocabulary"></span>
      </div>
      <div class="score-item">
        <span class="score-label">語句流暢度</span>
        <span class="score-value" id="result-fluency"></span>
      </div>
      <div class="score-item">
        <span class="score-label">話題連貫性</span>
        <span class="score-value" id="result-coherence"></span>
      </div>
      <div class="score-item">
        <span class="score-label">總字數</span>
        <span class="score-value" id="result-wordcount"></span>
      </div>
      <div class="score-item">
        <span class="score-label">停頓次數</span>
        <span class="score-value" id="result-hesitation"></span>
      </div>
      <div class="score-item">
        <span class="score-label">風險等級</span>
        <span class="score-value" id="result-risk"></span>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-ai-chat">
      AI 對話
    </button>
    <button class="btn" id="btn-share">
      略過對話 分享社群
    </button>

  </section>

  <!-- ── Phase 5: 分享 ──────────────────────────────────── -->
  <section class="phase hidden" id="phase-share">

    <img id="share-photo" src="" alt="照片" class="photo-thumb">

    <div class="share-post">
      <p id="share-post-text"></p>
    </div>

    <button class="btn btn-primary" id="btn-share-line">
      分享到 Line
    </button>
    <button class="btn btn-primary" id="btn-share-threads">
      分享到 Threads
    </button>
    <button class="btn" id="btn-copy">
      複製文字
    </button>

  </section>

</div>

<script>
  const SESSION_STATE = {{ session_state_json|default:"{}"|safe }};
</script>
<script src="{% static 'js/recorder.js' %}"></script>
<script src="{% static 'js/photo.js' %}"></script>

</body>
</html>
