<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>聲影日記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../static/css/index.css">
<link rel="stylesheet" href="../static/css/nav.css">
<link rel="stylesheet" href="../static/css/header.css">
</head>
<body>

<div id="header-placeholder"></div>

<!-- MAIN -->
<main>
  <section>
    <h2 class="welcome-name">早安，林奶奶 👋</h2>
    <p class="welcome-sub">今天想記錄下什麼美好的回憶嗎？</p>
  </section>
  <section>
{% if has_today_diary %}
<a href="/index/" style="text-decoration:none;display:block;">
  <button class="action-btn action-btn-today" style="width:100%;opacity:0.75;cursor:default;">
    <div style="text-align:left;">
      <span class="action-label">今天</span>
      <span class="action-sub">已完成今天的紀錄</span>
    </div>
    <span class="material-symbols-outlined" style="font-size:60px;font-variation-settings:'FILL' 1;">check_circle</span>
  </button>
</a>
{% else %}
<a href="/uploadPhoto/" style="text-decoration:none;display:block;">
  <button class="action-btn action-btn-today" style="width:100%;">
    <div style="text-align:left;">
      <span class="action-label">今天</span>
      <span class="action-sub">點擊開始記錄</span>
    </div>
    <span class="material-symbols-outlined" style="font-size:60px;font-variation-settings:'FILL' 1;">add_circle</span>
  </button>
</a>
{% endif %}
<a href="/review/" style="text-decoration:none;display:block;">
  <button class="action-btn action-btn-past" style="width:100%;">
    <div style="text-align:left;">
      <span class="action-label">動態回顧</span>
      <span class="action-sub">重溫過往的時光</span>
    </div>
    <span class="material-symbols-outlined" style="font-size:52px;">history_edu</span>
  </button>
</a>
  </section>

  <!-- 日曆卡片 -->
  <div class="cal-card">
    <div class="cal-header">
      <span class="cal-month-title" id="cal-title"></span>
      <button class="cal-view-btn" id="btn-view-toggle">以列表顯示</button>
    </div>
    <div class="cal-weekdays">
      <span class="cal-weekday">一</span>
      <span class="cal-weekday">二</span>
      <span class="cal-weekday">三</span>
      <span class="cal-weekday">四</span>
      <span class="cal-weekday">五</span>
      <span class="cal-weekday">六</span>
      <span class="cal-weekday">日</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="cal-list"></div>
    <div class="cal-footer">
      <button class="cal-nav-btn" id="btn-prev" aria-label="上一個月">
        <span class="material-symbols-outlined" style="font-size:22px;">chevron_left</span>
      </button>
      <button class="cal-picker-btn" id="btn-picker">
        <span id="picker-label">選擇 月／年</span>
        <span class="material-symbols-outlined" style="font-size:18px;">keyboard_arrow_down</span>
      </button>
      <button class="cal-nav-btn" id="btn-next" aria-label="下一個月">
        <span class="material-symbols-outlined" style="font-size:22px;">chevron_right</span>
      </button>
    </div>
  </div>
</main>

<!-- 月份選擇器 Popup -->
<div id="picker-popup">
  <div id="picker-box">
    <div class="picker-year-row">
      <button class="picker-year-btn" id="picker-prev-year">
        <span class="material-symbols-outlined" style="font-size:20px;">chevron_left</span>
      </button>
      <span class="picker-year-label" id="picker-year-label">2026 年</span>
      <button class="picker-year-btn" id="picker-next-year">
        <span class="material-symbols-outlined" style="font-size:20px;">chevron_right</span>
      </button>
    </div>
    <div class="picker-months" id="picker-months"></div>
  </div>
</div>

<!-- 日記內容 Modal -->
<div id="entry-overlay">
  <div id="entry-modal">
    <div class="modal-drag"></div>
    <div class="modal-header">
      <span class="modal-date" id="modal-date"></span>
      <button class="modal-close" id="modal-close-btn">
        <span class="material-symbols-outlined" style="font-size:20px;">close</span>
      </button>
    </div>
    <div class="modal-photo">
      <div class="modal-photo-placeholder" id="modal-photo-placeholder">
        <span class="material-symbols-outlined" style="font-size:40px;opacity:.4;">image</span>
        <span style="font-size:13px;opacity:.5;">尚未上傳照片</span>
      </div>
      <img id="modal-photo-img" style="display:none;" alt="日記照片"/>
    </div>
    <audio id="modal-audio" style="display:none;"></audio>
    <button class="modal-play-btn" id="modal-play-btn">
      <span class="material-symbols-outlined" id="modal-play-icon" style="font-size:22px;font-variation-settings:'FILL' 1;">play_arrow</span>
      <span id="modal-play-text">播放語音</span>
    </button>
    <div class="modal-transcript">
      <div class="modal-transcript-title">語音轉譯內容</div>
      <div class="modal-transcript-text" id="modal-transcript"></div>
    </div>
  </div>
</div>

<div id="nav-placeholder"></div>

<script>
  window.CALENDAR_DATA = {{ calendar_data_json|safe }};
</script>

<script src="../static/js/index.js"></script>
<script src="../static/js/nav.js"></script>
<script src="../static/js/header.js"></script>

</body>
</html>
